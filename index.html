
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage banking products.">
  <title>Banking Products</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="header-label">BANKING</p>
        <h1>My products</h1>
        <p class="header-description">
          Your accounts, cards, loans and investments.
        </p>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Product search and filters">
      <div class="toolbar-heading">
        <h2>Products</h2>
        <p>Browse your banking products below.</p>
      </div>

      <div class="toolbar-controls">
        <div id="filters" aria-label="Filter by category"></div>

        <input
          type="search"
          id="search"
          placeholder="Search by name"
          aria-label="Search banking products"
        >
      </div>
    </section>

    <section
      id="grid"
      aria-label="Banking products"
      aria-live="polite"
    ></section>
  </main>

  <div
    id="modal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div class="modal-box">
      <p class="modal-label">PRODUCT DETAILS</p>
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <p id="modal-status"></p>
      <button id="modal-close" type="button">Close</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
